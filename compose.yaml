services :
  redis :
    image : redis:7-alpine
    ports :
      - "127.0.0.1:6379:6379"
    volumes:
      - leaderboard_redis_data:/data
    command: ["redis-server" ,"--appendonly" ,"yes","--requirepass","${REDIS_PASSWORD:?REDIS_PASSWORD belum diatur}" ]
    restart: unless-stopped

  postgres :
    image : postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER : ${POSTGRES_USER}
      POSTGRES_PASSWORD : ${DB_PASSWORD?:DB_PASSWORD belum di atur}
    volumes:
      - leaderboard_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  leaderboard_redis_data:
  leaderboard_postgres_data: