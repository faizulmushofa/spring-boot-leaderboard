services :
  redis :
    image : redis:7-alpine
    ports :
      - "127.0.0.1:6379:6379"
    volumes:
      - leaderboard_redis_data:/data
    command: ["redis-server" ,"--appendonly" ,"yes","--requirepass","${REDIS_PASSWORD:?REDIS_PASSWORD belum diatur}" ]
    restart: unless-stopped

  postgres :
    image : postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER : ${POSTGRES_USER}
      POSTGRES_PASSWORD : ${DB_PASSWORD:?DB_PASSWORD belum di atur}
    volumes:
      - leaderboard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  flyway :
    image : flyway/flyway:11-alpine
    command : migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL : jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER : ${POSTGRES_USER}
      FLYWAY_PASSWORD : ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  leaderboard_redis_data:
  leaderboard_postgres_data: