spring:
  application:
    name: LEADERBOARD-SYSTEM

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
        shutdown-timeout: 200ms

  flyway:
    enabled: false

server:
  port: 8080
